version: '3'

includes:
  common: ../Taskfile.yml

vars:
  WINDOWS_LDFLAGS: >-
    -w -s -H windowsgui
    -X github.com/a448582655/vibe-proxy/internal/buildinfo.Version={{.VERSION}}
    -X github.com/a448582655/vibe-proxy/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/a448582655/vibe-proxy/internal/buildinfo.BuildDate={{.BUILD_DATE}}

tasks:
  build:
    deps: [common:go:mod:verify, common:generate:icons]
    cmds:
      - task: generate:syso
      - go build -trimpath -buildvcs=false -ldflags='{{.WINDOWS_LDFLAGS}}' -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .
      - cmd: powershell -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue *.syso"
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [darwin, linux]
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: 0

  generate:syso:
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_{{.ARCH}}.syso

  package:
    deps:
      - task: build
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3 generate webview2bootstrapper -dir build/windows/nsis
      - go run build/windows/patch-webview2.go build/windows/nsis/wails_tools.nsh
      - |
        {{if eq OS "windows"}}
        makensis -DINFO_PRODUCTVERSION="{{.VERSION | trimPrefix "v"}}" -DINFO_PRODUCTVERSION_NUMERIC="{{.VERSION_NUMERIC}}" -DARG_WAILS_{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" build/windows/nsis/project.nsi
        {{else}}
        makensis -DINFO_PRODUCTVERSION="{{.VERSION | trimPrefix "v"}}" -DINFO_PRODUCTVERSION_NUMERIC="{{.VERSION_NUMERIC}}" -DARG_WAILS_{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" build/windows/nsis/project.nsi
        {{end}}

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
