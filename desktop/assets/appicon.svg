<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Proxy</title>
  <desc id="desc">Two protocol streams pass through a transformation gate and leave as one stable channel.</desc>
  <defs>
    <linearGradient id="background" x1="112" y1="72" x2="912" y2="952" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7657FF"/>
      <stop offset="0.48" stop-color="#5B32DB"/>
      <stop offset="1" stop-color="#26105F"/>
    </linearGradient>
    <linearGradient id="upperStream" x1="162" y1="348" x2="492" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E0FF"/>
    </linearGradient>
    <linearGradient id="lowerStream" x1="162" y1="676" x2="492" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8BEFF"/>
      <stop offset="1" stop-color="#9D8CFF"/>
    </linearGradient>
    <linearGradient id="outputStream" x1="560" y1="512" x2="866" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BFFD9"/>
      <stop offset="1" stop-color="#54E3BA"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="0" cy="0" r="1" gradientTransform="translate(548 512) rotate(90) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFC6FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#CFC6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="mintGlow" x="500" y="404" width="430" height="216" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="4"/>
  <circle cx="548" cy="512" r="330" fill="url(#portalGlow)"/>

  <path d="M176 348h102c70 0 104 35 145 77l73 73" fill="none" stroke="url(#upperStream)" stroke-width="72" stroke-linecap="round"/>
  <path d="M176 676h102c70 0 104-35 145-77l73-73" fill="none" stroke="url(#lowerStream)" stroke-width="72" stroke-linecap="round"/>

  <path d="M574 512h286" fill="none" stroke="#66F0C6" stroke-opacity=".36" stroke-width="104" stroke-linecap="round" filter="url(#mintGlow)"/>
  <path d="M566 512h294" fill="none" stroke="url(#outputStream)" stroke-width="76" stroke-linecap="round"/>

  <path d="M470 282 580 512 470 742" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M478 309 573 512 478 715" fill="none" stroke="#EDE9FF" stroke-opacity=".32" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
