name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.5'
  NSIS_VERSION: '3.12.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Require release commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify embedded frontend is current
        run: git diff --exit-code -- internal/runtime/web/dist

      - name: Test without CGO
        run: CGO_ENABLED=0 go test ./...

      - name: Vet without CGO
        run: CGO_ENABLED=0 go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Test release packaging contracts
        run: |
          bash scripts/release/test-packaging.sh
          bash scripts/release/test-desktop-packaging.sh

  portable:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        id: binary
        shell: bash
        run: |
          extension=
          if [[ "${{ matrix.goos }}" == windows ]]; then
            extension=.exe
          fi
          binary="$RUNNER_TEMP/vibe-proxy-${{ matrix.goos }}-${{ matrix.goarch }}${extension}"
          scripts/release/build-binary.sh \
            "$GITHUB_REF_NAME" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            "$binary" >/dev/null
          echo "path=$binary" >>"$GITHUB_OUTPUT"

      - name: Package portable artifact
        id: package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          artifact=$(
            scripts/release/package-portable.sh \
              "$GITHUB_REF_NAME" \
              "${{ matrix.goos }}" \
              "${{ matrix.goarch }}" \
              "${{ steps.binary.outputs.path }}" \
              "$RUNNER_TEMP/release-assets"
          )
          echo "path=$artifact" >>"$GITHUB_OUTPUT"

      - name: Smoke-test native Linux binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          "${{ steps.binary.outputs.path }}" --version |
            grep -F "vibe-proxy $GITHUB_REF_NAME"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  deb:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Linux binary
        id: binary
        run: |
          binary="$RUNNER_TEMP/vibe-proxy-linux-${{ matrix.goarch }}"
          scripts/release/build-binary.sh \
            "$GITHUB_REF_NAME" linux "${{ matrix.goarch }}" "$binary" >/dev/null
          echo "path=$binary" >>"$GITHUB_OUTPUT"

      - name: Package DEB
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          artifact=$(
            scripts/release/package-deb.sh \
              "$GITHUB_REF_NAME" \
              "${{ matrix.goarch }}" \
              "${{ steps.binary.outputs.path }}" \
              "$RUNNER_TEMP/release-assets"
          )
          dpkg-deb --info "$artifact" >/dev/null
          echo "path=$artifact" >>"$GITHUB_OUTPUT"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  dmg:
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build macOS binary
        id: binary
        run: |
          binary="$RUNNER_TEMP/vibe-proxy-darwin-${{ matrix.goarch }}"
          scripts/release/build-binary.sh \
            "$GITHUB_REF_NAME" darwin "${{ matrix.goarch }}" "$binary" >/dev/null
          echo "path=$binary" >>"$GITHUB_OUTPUT"

      - name: Package DMG
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          artifact=$(
            scripts/release/package-dmg.sh \
              "$GITHUB_REF_NAME" \
              "${{ matrix.goarch }}" \
              "${{ steps.binary.outputs.path }}" \
              "$RUNNER_TEMP/release-assets"
          )
          hdiutil imageinfo "$artifact" >/dev/null
          echo "path=$artifact" >>"$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version="$env:NSIS_VERSION" --yes --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS makensis.exe was not installed at $nsis"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build desktop installer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          scripts/release/build-desktop.sh \
            "$GITHUB_REF_NAME" windows "${{ matrix.goarch }}" \
            "$RUNNER_TEMP/release-assets"
      - name: Verify desktop binary and PE architecture
        shell: pwsh
        run: |
          $binary = "desktop/bin/vibe-proxy-desktop.exe"
          & $binary --version | Select-String -SimpleMatch "vibe-proxy $env:GITHUB_REF_NAME"
          $bytes = [IO.File]::ReadAllBytes($binary)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          $expected = if ("${{ matrix.goarch }}" -eq "amd64") { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expected) { throw "Unexpected PE machine: $machine" }
      - name: Package portable desktop app
        shell: pwsh
        run: |
          ./scripts/release/package-desktop-portable.ps1 `
            -Version $env:GITHUB_REF_NAME `
            -Architecture "${{ matrix.goarch }}" `
            -Binary "desktop/bin/vibe-proxy-desktop.exe" `
            -OutputDirectory "$env:RUNNER_TEMP/release-assets"
      - name: Upload Windows desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-${{ matrix.goarch }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            runner: macos-14
          - goarch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Build desktop app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          scripts/release/build-desktop.sh \
            "$GITHUB_REF_NAME" darwin "${{ matrix.goarch }}" \
            "$RUNNER_TEMP/release-assets"
      - name: Inspect and package desktop app
        shell: bash
        run: |
          app="desktop/bin/Vibe Proxy.app"
          binary="$app/Contents/MacOS/vibe-proxy-desktop"
          "$binary" --version | grep -F "vibe-proxy $GITHUB_REF_NAME"
          expected=${{ matrix.goarch }}
          [[ "$expected" != amd64 ]] || expected=x86_64
          [[ "$(lipo -archs "$binary")" == "$expected" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == io.vibeproxy.desktop ]]
          artifact=$(scripts/release/package-desktop-dmg.sh \
            "$GITHUB_REF_NAME" "${{ matrix.goarch }}" "$app" \
            "$RUNNER_TEMP/release-assets")
          hdiutil imageinfo "$artifact" >/dev/null
      - name: Upload macOS desktop package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.goarch }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [portable, deb, dmg, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release asset manifest
        run: scripts/release/verify-assets.sh "$GITHUB_REF_NAME" dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- * |
            LC_ALL=C sort -k2 > SHA256SUMS

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --draft
            --title "vibe-proxy $GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
