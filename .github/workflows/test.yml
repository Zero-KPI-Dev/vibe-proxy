name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  shell-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Docker launcher security contracts
        run: bash scripts/test-dev-docker.sh

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify embedded frontend is current
        run: git diff --exit-code -- internal/runtime/web/dist

  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.12', '1.26.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Go test
        run: CGO_ENABLED=0 go test ./...
      - name: Go vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/vibe-proxy ./cmd/vibe-proxy

  windows-test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Go test
        run: go test ./...

  release-packaging-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Test release packaging contracts
        run: bash scripts/release/test-packaging.sh
      - name: Cross-build Debian packages
        shell: bash
        run: |
          version=v0.0.0-ci
          binary_dir=$(mktemp -d)
          asset_dir=$(mktemp -d)

          for goarch in amd64 arm64; do
            binary="$binary_dir/vibe-proxy-linux-$goarch"
            scripts/release/build-binary.sh \
              "$version" linux "$goarch" "$binary" >/dev/null
            scripts/release/package-deb.sh \
              "$version" "$goarch" "$binary" "$asset_dir" >/dev/null
          done

          printf '%s\n' \
            vibe-proxy_0.0.0-ci_linux_amd64.deb \
            vibe-proxy_0.0.0-ci_linux_arm64.deb \
            >"$RUNNER_TEMP/release-assets.expected"
          find "$asset_dir" -maxdepth 1 -type f -exec basename {} \; |
            LC_ALL=C sort >"$RUNNER_TEMP/release-assets.actual"
          diff -u \
            "$RUNNER_TEMP/release-assets.expected" \
            "$RUNNER_TEMP/release-assets.actual"
