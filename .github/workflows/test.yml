name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.12', '1.26.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Go test
        run: CGO_ENABLED=0 go test ./...
      - name: Go vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/vibe-proxy ./cmd/vibe-proxy

  windows-test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Go test
        run: go test ./...
